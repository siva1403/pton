name: PR Bypass Alert

on:
  push:
    branches:
      - main
jobs:
  detect-bypass:
    runs-on: ubuntu-latest

    steps:
      - name: Check PR conditions
        uses: actions/github-script@v7
        id: check
        with:
          script: |
            const pr = context.payload.pull_request;

            if (!pr.merged) {
              return { bypass: false };
            }

            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            const approvals = reviews.data.filter(r => r.state === "APPROVED");

            // Example rule: require at least 1 approval
            if (approvals.length === 0) {
              return {
                bypass: true,
                user: pr.merged_by.login,
                pr: pr.number
              };
            }

            return { bypass: false };

      - name: Send email if bypass detected
        if: steps.check.outputs.result.bypass == true
        run: |
          python send_email.py '${{ steps.check.outputs.result }}'