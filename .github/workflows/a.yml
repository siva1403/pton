name: Run Flask and Save Output

on:
  push:

jobs:
  run-and-save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install flask requests

      - name: Run Flask app
        run: |
          python app.py &
          sleep 5

      - name: Call API and save output
        run: |
          mkdir -p results
          curl http://127.0.0.1:5000 > results/${{ github.sha }}.txt

      - name: Commit and push result
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add results/
          git diff --cached --quiet || git commit -m "Add result for ${{ github.sha }} [skip ci]"
          git push