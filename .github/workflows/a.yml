name: Flask CI + Email Alert

on:
  push:

jobs:
  test-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install flask requests

      - name: Run Flask app
        run: |
          python app.py &
          sleep 5

      - name: Test endpoint
        id: test
        run: |
          curl -f http://127.0.0.1:5000 && echo "status=success" >> $GITHUB_OUTPUT

      - name: Send Email (Success)
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Flask App Success"
          body: "Your Flask app ran successfully on commit ${{ github.sha }}"
          to: your-email@gmail.com
          from: GitHub Actions

      - name: Send Email (Failure)
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "❌ Flask App Failed"
          body: "Flask app failed on commit ${{ github.sha }}"
          to: your-email@gmail.com
          from: GitHub Actions